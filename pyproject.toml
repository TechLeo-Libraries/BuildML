[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buildml"
version = "2.4.0a2"
description = "BuildML — a flexible, depth-first toolkit for building ML workflows."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Leonard Onyiriuba", email = "leonard.c.onyiriuba@gmail.com" },
]
keywords = [
  "machine learning",
  "data science",
  "data preprocessing",
  "supervised learning",
  "ML toolkit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
duckdb = ["duckdb>=0.10"]
engines = ["buildml[polars,duckdb]"]
optuna = ["optuna>=3.4"]
automl = ["buildml[optuna]"]
automl-industry = [
  "buildml[automl]",
  "flaml>=2.1",
  "autogluon.tabular>=1.1",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "catboost>=1.2",
]
torch = ["torch>=2.2", "pillow>=9.0", "soundfile>=0.12"]
ssl = ["buildml[torch]", "sentence-transformers>=2.2", "transformers>=4.36"]
dl = ["buildml[torch]"]
audio = ["buildml[torch]"]
speech = ["buildml[torch]", "transformers>=4.36"]
vision = ["buildml[torch]", "torchvision>=0.17"]
pretrained = ["buildml[vision,speech]"]
onnx = ["onnx>=1.15"]
rag = ["sentence-transformers>=2.2", "transformers>=4.36"]
rag-advanced = ["buildml[rag]", "langchain-community>=0.2", "langchain-core>=0.2"]
graph = ["networkx>=3.0"]
graph-pyg = ["buildml[torch]", "torch-geometric>=2.5"]
rl = ["gymnasium>=0.29"]
rl-industry = [
  "buildml[rl]",
  "stable-baselines3>=2.3",
  "imitation>=1.0",
  "torch>=2.2",
]
tda = ["ripser>=0.6", "persim>=0.3"]
# giotto-tda lacks reliable Py3.13 wheels on several platforms.
tda-industry = [
  "buildml[tda]",
  "giotto-tda>=0.6; python_version < '3.13'",
]
ai = ["openai>=1.0"]
llm = ["buildml[ai]"]
imbalanced = ["imbalanced-learn>=0.11"]
unsupervised = ["hdbscan>=0.8", "umap-learn>=0.5"]
timeseries = ["statsmodels>=0.14", "scipy>=1.11", "ruptures>=1.1"]
timeseries-prophet = ["buildml[timeseries]", "prophet>=1.1"]
# neuralforecast / dependency stack is best-effort on Py3.13 (marker skips hard fail).
timeseries-ml = [
  "buildml[timeseries]",
  "neuralforecast>=1.7; python_version < '3.13'",
  "torch>=2.2",
]
anomaly-industry = [
  "pyod>=1.1",
  "lightgbm>=4.0",
  "xgboost>=2.0",
]
activelearning-industry = [
  "scikit-activeml>=1.0.0",
]
semisupervised-industry = [
  "lightgbm>=4.0",
  "xgboost>=2.0",
]
ranking-industry = [
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "catboost>=1.2",
]
# learn2learn pulls qpth/numpy pins that break on Py3.13; native FO MAML remains.
metalearning-industry = [
  "learn2learn>=0.2; python_version < '3.13'",
]
multitask-industry = [
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "catboost>=1.2",
]
online-industry = [
  "river>=0.21",
]
# LightFM split out so implicit still installs when LightFM has no wheel.
recommenders-industry = [
  "implicit>=0.7",
]
recommenders-lightfm = [
  "lightfm>=1.17; python_version < '3.13' and sys_platform != 'win32'",
]
causal-industry = [
    "dowhy>=0.11",
    "econml>=0.15",
]
federated-industry = [
    "flwr>=1.5",
]
kg-industry = [
    "pykeen>=1.10",
]
probabilistic-industry = [
    "mapie>=0.8",
    "ngboost>=0.5",
]
# skope-rules is broken on Py3.13 (collections.Iterable); imodels/z3 still install.
symbolic-industry = [
    "skope-rules>=1.0; python_version < '3.13'",
    "imodels>=2.0",
    "z3-solver>=4.12",
]
cbr-industry = [
    "hnswlib>=0.8",
]
# NLP core (bag-of-n-grams, lexicon sentiment, rule NER, graph summarization,
# native language ID) needs nothing beyond scikit-learn. These extras add the
# optional paths: NLTK morphology, langdetect, sentence embeddings, and
# transformer encoders.
nlp = [
    "nltk>=3.8",
    "langdetect>=1.0.9",
    "sentence-transformers>=2.2",
    "transformers>=4.36",
]
nlp-industry = [
    "buildml[nlp]",
    "spacy>=3.7",
]
optimize-industry = [
  "pulp>=2.7",
  "ortools>=9.8",
  "cvxpy>=1.4",
  "xgboost>=2.0",
]
synthetic-industry = [
  "sdv>=1.17",
  "sdmetrics>=0.15",
]
# One-shot install for industry-depth ML domains (R1–R6 refinement).
# Core `import buildml` stays light — Session + numpy/pandas/sklearn only.
# Best-effort meta-extra: Python/platform markers skip packages without wheels
# (esp. Windows + Py3.13). Does not pull dashboard, serve, ai, or dev tooling.
production = [
  "buildml[torch]",
  "buildml[ssl]",
  "buildml[rag]",
  "buildml[rag-advanced]",
  "buildml[tda]",
  "buildml[unsupervised]",
  "buildml[timeseries]",
  "buildml[timeseries-prophet]",
  "buildml[timeseries-ml]",
  "buildml[graph]",
  "buildml[graph-pyg]",
  "buildml[optuna]",
  "buildml[automl]",
  "buildml[automl-industry]",
  "buildml[tda-industry]",
  "buildml[anomaly-industry]",
  "buildml[semisupervised-industry]",
  "buildml[ranking-industry]",
  "buildml[multitask-industry]",
  "buildml[activelearning-industry]",
  "buildml[metalearning-industry]",
  "buildml[online-industry]",
  "buildml[recommenders-industry]",
  "buildml[recommenders-lightfm]",
  "buildml[causal-industry]",
  "buildml[federated-industry]",
  "buildml[kg-industry]",
  "buildml[probabilistic-industry]",
  "buildml[symbolic-industry]",
  "buildml[cbr-industry]",
  "buildml[nlp]",
  "buildml[nlp-industry]",
  "buildml[optimize-industry]",
  "buildml[synthetic-industry]",
  "buildml[rl]",
  "buildml[rl-industry]",
]
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
reports = ["sweetviz>=2.3", "ydata-profiling>=4.6"]
eda = ["buildml[viz,reports]"]
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]
dashboard = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "plotly>=5.18",
  "kaleido>=0.2.1",
  "reportlab>=4.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]
excel = ["openpyxl>=3.1"]
all-classical = ["buildml[engines,imbalanced,eda,excel,dashboard,optuna,automl]"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "build>=1.0",
  "pandas-stubs>=2.0",
  "httpx>=0.27",
  "sphinx",
  "sphinx-rtd-theme",
  "myst-parser",
  "buildml[dashboard]",
]

[project.scripts]
buildml-serve = "buildml.serving.cli:main"

[project.urls]
Homepage = "https://github.com/TechLeo-Libraries/BuildML"
Documentation = "https://buildml.readthedocs.io/"

[tool.setuptools.packages.find]
where = ["."]
include = ["buildml*"]
exclude = ["buildml._legacy*"]

[tool.setuptools.package-data]
buildml = [
  "py.typed",
  "dashboard/static/**/*",
  "dashboard/templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=tests/.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["buildml/_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Session ops modules share a deliberate star-import surface from `_imports`.
"buildml/session/*_ops.py" = ["F403", "F405", "UP037", "E501"]
"buildml/session/_imports.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["buildml/_legacy/", "build/", "docs/"]

# NumPy >=2.5 stubs use PEP 695 `type` statements; mypy refuses to parse them
# under python_version=3.10 (our runtime floor). Skip numpy stub internals —
# we already treat third-party imports as untyped via ignore_missing_imports.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = "buildml._legacy.*"
ignore_errors = true

# Gradual typing: Session facade + ops still return through untyped helpers.
# Scoped CI covers core/explain; widen this override only with intentional cleanup.
[[tool.mypy.overrides]]
module = [
  "buildml.session.*",
  "buildml.dashboard.*",
  "buildml.explain.overlays.*",
  "buildml.explain.catalog",
]
warn_return_any = false
