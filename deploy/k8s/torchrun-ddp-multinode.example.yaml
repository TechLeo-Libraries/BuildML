# Example multi-node Kubernetes Job + headless Service + ConfigMap for torchrun DDP.
# Prefer Session.emit_k8s_ddp_job(..., include_configmap=True) / buildml.dl.k8s
# to render parameterized copies.
#
# Honesty:
# - Not live multi-cluster orchestration
# - Not a Helm chart product
# - Operator must provide GPU nodes, networking, shared data, and RBAC
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildml-torchrun-ddp-env
  namespace: default
  labels:
    app.kubernetes.io/name: buildml-torchrun-ddp
    app.kubernetes.io/part-of: buildml
data:
  MASTER_PORT: "29500"
  PET_NNODES: "2"
  PET_NPROC_PER_NODE: "2"
  TRAIN_SCRIPT: "/workspace/train.py"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: buildml-torchrun-ddp
  namespace: default
  labels:
    app.kubernetes.io/name: buildml-torchrun-ddp
    app.kubernetes.io/part-of: buildml
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildml-torchrun-ddp
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
          envFrom:
            - configMapRef:
                name: buildml-torchrun-ddp-env
          env:
            - name: MASTER_ADDR
              value: buildml-torchrun-ddp-0.buildml-torchrun-ddp
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              NODE_RANK="${JOB_COMPLETION_INDEX:-0}"
              torchrun \
                --nnodes="${PET_NNODES}" \
                --nproc_per_node="${PET_NPROC_PER_NODE}" \
                --node_rank="$NODE_RANK" \
                --master_addr="$MASTER_ADDR" \
                --master_port="$MASTER_PORT" \
                "${TRAIN_SCRIPT}"
---
apiVersion: v1
kind: Service
metadata:
  name: buildml-torchrun-ddp
  namespace: default
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: buildml-torchrun-ddp
    job-name: buildml-torchrun-ddp
  ports:
    - name: rdzv
      port: 29500
      targetPort: 29500
