# Example Kubernetes Deployment + Service + Secret for BuildML managed serve.
# Prefer Session.emit_k8s_serve_deployment / buildml.dl.k8s.write_serve_deployment
# to render parameterized copies.
#
# Image: build from deploy/serve/Dockerfile
#   docker build -f deploy/serve/Dockerfile -t buildml-serve:local .
#   # then retag/push to your registry and set image: below
#
# Honesty:
# - Template only — not live multi-cluster orchestration
# - Not a Helm chart / control-plane product
# - Not managed cloud IAM; wire TLS/Ingress, volumes, and RBAC yourself
# - Does NOT enable insecure public bind override (API key from Secret is required)
apiVersion: v1
kind: Secret
metadata:
  name: buildml-serve-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: buildml-serve
    app.kubernetes.io/part-of: buildml
type: Opaque
stringData:
  # Replace before apply. Prefer `kubectl create secret generic ...` in real clusters.
  api-key: "CHANGE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildml-serve
  namespace: default
  labels:
    app.kubernetes.io/name: buildml-serve
    app.kubernetes.io/part-of: buildml
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildml-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildml-serve
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: serve
          image: buildml-serve:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          env:
            - name: BUILDML_BUNDLE
              value: /models/pipeline_bundle
            - name: BUILDML_SERVE_KIND
              value: pipeline
            - name: BUILDML_SERVE_TRUSTED
              value: "true"
            - name: BUILDML_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buildml-serve-secrets
                  key: api-key
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              if [[ -z "${BUILDML_API_KEY:-}" ]]; then
                echo "BUILDML_API_KEY secret is required (insecure public bind override is not enabled)" >&2
                exit 1
              fi
              exec buildml-serve \
                --bundle "${BUILDML_BUNDLE}" \
                --kind "${BUILDML_SERVE_KIND}" \
                --host 0.0.0.0 \
                --port 8080 \
                --api-key "${BUILDML_API_KEY}" \
                --trusted
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: model-bundle
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-bundle
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: buildml-serve
  namespace: default
  labels:
    app.kubernetes.io/name: buildml-serve
    app.kubernetes.io/part-of: buildml
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buildml-serve
  ports:
    - name: http
      port: 8080
      targetPort: http
