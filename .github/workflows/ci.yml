name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Manual re-run when a push was made with a token that skipped workflow events,
  # or when validating CI wiring without an empty commit.
  workflow_dispatch:
  workflow_call:

# Least-privilege GITHUB_TOKEN for every job. Jobs that only checkout and
# test do not need write access to contents, issues, or pull requests.
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation with strict references
        run: python -m sphinx -n -W --keep-going -b html -w sphinx-warnings.log docs artifacts/docs-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-reference-check
          path: sphinx-warnings.log

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core + dev + native graph contracts)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,graph]"

      - name: Import smoke
        run: python -c "import buildml; print(buildml.__version__); assert hasattr(buildml, 'Session')"

      - name: Ruff
        run: ruff check buildml tests scripts docs/conf.py

      - name: User copy lint
        run: python scripts/lint_user_copy.py

      - name: Teaching surface sync
        run: python scripts/sync_teaching_surface.py --check

      - name: Teaching example contracts
        run: python scripts/check_teaching_examples.py

      - name: Documentation example syntax and standalone imports
        run: python scripts/check_documentation_examples.py --output artifacts/documentation-examples.json

      - name: Release claim references
        run: python scripts/check_release_claims.py

      # Ratchet: enforces the CONTRIBUTING.md docstring standard on the
      # packages listed in scripts/audit_docstrings.py ENFORCED_PREFIXES.
      - name: Docstring standard
        run: python scripts/audit_docstrings.py --check

      # Scoped typing ratchet. Session package is fully under warn_return_any;
      # dashboard / explain overlays still use warn_return_any=false overlays.
      # Domain packages below were verified clean with --follow-imports=silent
      # (gradual expand; do not add packages that still fail).
      - name: Mypy (scoped)
        run: >
          mypy --follow-imports=silent
          buildml/core
          buildml/_version.py
          buildml/explain/schemas.py
          buildml/explain/history.py
          buildml/explain/sync.py
          buildml/explain/concepts
          buildml/explain/capability_status.py
          buildml/explain/glossary.py
          buildml/explain/prerequisites.py
          buildml/session
          buildml/fairness
          buildml/serving
          buildml/pipeline
          buildml/online
          buildml/federated
          buildml/activelearning
          buildml/ensemble
          buildml/anomaly
          buildml/unsupervised
          buildml/timeseries
          buildml/causal
          buildml/reporting
          buildml/checkpoint

      - name: Domain maturity index
        run: python scripts/domain_maturity_index.py --check --report

      # Coverage fail_under comes from pyproject.toml [tool.coverage.report]
      # and scripts/coverage_ratchet.json (active 69; Linux CI monolith).
      - name: Pytest
        run: pytest --cov=buildml --cov-report=term-missing

      - name: Checkpoint + pipeline smoke
        run: pytest tests/integration/test_checkpoint_pipeline_smoke.py -q

      - name: Classical alpha-gate smoke
        run: pytest tests/integration/test_classical_alpha_smoke.py -q

      - name: Industry extras probe (informational)
        run: >
          python scripts/probe_industry_extras.py
          --artifact industry-probe.json
          --markdown industry-probe.md
        continue-on-error: true

      - name: Build wheel
        run: python -m build

      - name: Wheel ships import-critical data
        run: python scripts/check_wheel_contents.py dist

      - name: Clean-install wheel import smoke
        if: matrix.python-version == '3.12'
        run: |
          python -m venv "${{ runner.temp }}/buildml-wheel-probe"
          "${{ runner.temp }}/buildml-wheel-probe/bin/pip" install --upgrade pip
          "${{ runner.temp }}/buildml-wheel-probe/bin/pip" install dist/buildml-*.whl
          "${{ runner.temp }}/buildml-wheel-probe/bin/python" -c "import buildml; from buildml import Session; print(buildml.__version__)"

  # Classical-only Windows gate. Core + dev install (no Torch / industry extras).
  # Torch, PyG, and several industry wheels stay Linux-only in CI — see the
  # torch/rag/benchmarks jobs and README install honesty. Industry probe is
  # informational: missing Windows/Py3.13 wheels must not fail the job.
  windows-classical:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core + dev; no Torch/industry)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke
        run: python -c "import buildml; print(buildml.__version__); assert hasattr(buildml, 'Session')"

      - name: Ruff
        run: ruff check buildml tests scripts docs/conf.py

      - name: Classical alpha-gate smoke
        run: pytest tests/integration/test_classical_alpha_smoke.py -q

      - name: Industry extras probe (informational; expect many skips)
        run: >
          python scripts/probe_industry_extras.py
          --artifact industry-probe-windows.json
          --markdown industry-probe-windows.md
        continue-on-error: true

  engines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with engines + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,engines]"

      - name: Require engine backends
        run: python -c "import polars, duckdb"

      - name: Engine adapter and native-depth tests
        run: |
          pytest \
            tests/unit/test_engines.py \
            tests/unit/test_engine_persistence_contracts.py \
            tests/unit/test_engine_aggregate.py \
            tests/unit/test_duckdb_pushdown.py \
            tests/unit/test_duckdb_arrow_ipc.py \
            tests/unit/test_duckdb_connection_lifecycle.py \
            tests/unit/test_polars_filter_expr.py \
            tests/unit/test_polars_lazyframe_handle.py \
            tests/unit/test_portable_filter_expr.py \
            tests/unit/test_checkpoint_native_sidecar.py \
            tests/unit/test_checkpoint_native_reattach.py \
            tests/unit/test_checkpoint_sidecar_layout.py \
            tests/unit/test_lazy_native_disclosure.py \
            tests/unit/test_lazy_native_ingest.py \
            -q

  optimization-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real optimization backends
        run: python -m pip install --no-cache-dir -e ".[dev,optimize-industry]"
      - name: Require optimization dependencies
        run: |
          python -m pip check
          python -c "import pulp, cvxpy; from ortools.linear_solver import pywraplp; assert pulp.COIN_CMD().available(); assert pywraplp.Solver.CreateSolver('SCIP') is not None"
          python -c "from ortools.linear_solver import pywraplp; import cvxpy; assert pywraplp.Solver.CreateSolver('SCIP') is not None"
      - name: Proven optimality and budget contracts
        run: >
          python -m pytest
          tests/unit/test_pulp_compatibility.py
          tests/unit/test_ortools_optimality_contracts.py
          tests/unit/test_optimize_industry_depth.py
          tests/unit/test_optimize_cvxpy_adapter.py
          tests/unit/test_optimize_slice.py
          tests/integration/test_optimize_alpha_smoke.py
          -q

  optuna:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with optuna + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,optuna]"

      - name: Optuna search / nested-CV tests
        run: |
          pytest \
            tests/unit/test_optuna_search.py \
            tests/unit/test_nested_cv_optuna.py \
            tests/unit/test_nested_cv_warm_start.py \
            -q

  torch:
    runs-on: ubuntu-latest
    env:
      PYTHONFAULTHANDLER: "1"
      TORCH_SHOW_CPP_STACKTRACES: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with torch + onnx + lean test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[torch,onnx]"
          pip install pytest pytest-cov ruff

      - name: Core import smoke without relying on classical extras
        run: python -c "import buildml; print(buildml.__version__)"

      - name: Torch DL slice + M2 depth + Phase C + Pass G/J/L/O/Q/R + DL alpha-gate smoke
        run: |
          pytest \
            tests/unit/test_dl_torch_slice.py \
            tests/unit/test_ddp_sampling_contracts.py \
            tests/unit/test_ddp_result_transfer.py \
            tests/unit/test_tabular_torch_prediction_contracts.py \
            tests/unit/test_meta_adaptation_contracts.py \
            tests/unit/test_dl_m2_depth.py \
            tests/unit/test_dl_phase_c.py \
            tests/unit/test_pass_g_dl_depth.py \
            tests/unit/test_pass_j_image_multimodal.py \
            tests/unit/test_pass_l_audio_multimodal.py \
            tests/unit/test_pass_o_speech_ddp_serve.py \
            tests/unit/test_pass_q_label_encoding.py \
            tests/unit/test_pass_r_pretrained_serve_k8s.py \
            tests/unit/test_pass_v_capability_depth.py \
            tests/integration/test_dl_torch_smoke.py \
            tests/integration/test_dl_alpha_smoke.py \
            -q

      - name: DL alpha-gate smoke (explicit)
        run: pytest tests/integration/test_dl_alpha_smoke.py -q

      - name: Repeated buffered DDP validation on this Torch/Python stack
        timeout-minutes: 15
        run: python scripts/verify_ddp_reliability.py --repetitions 10 --output artifacts/ddp-reliability

      - name: Preserve DDP repetitions and native failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ddp-reliability-python-${{ matrix.python-version }}
          path: artifacts/ddp-reliability
          if-no-files-found: warn

      - name: Torch anomaly autoencoder acceptance
        run: |
          python -c "import torch"
          python -m pytest tests/unit/test_anomaly_industry_depth.py::test_torch_autoencoder_fit -q

  expanded-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HNSWLIB_NO_NATIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-expanded-coverage.txt
            requirements-expanded-coverage-constraints.txt
      - name: Install CPU Torch and the assessed backend profile
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-expanded-coverage.txt
          # Cached source-built wheels can contain instructions from another CPU.
          python -m pip install --force-reinstall --no-deps --no-cache-dir --no-binary=hnswlib hnswlib==0.8.0
          python -m pip check
      - name: Require the portable ANN backend
        run: |
          python -c "import hnswlib; print(hnswlib.__file__)"
          pytest tests/unit/test_cbr_industry_depth.py::test_industry_session_path -q
      - name: Preserve source and actual dependency evidence
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/expanded-source-revision.txt
          python -m pip list --format=json > artifacts/expanded-environment.json
      - name: Whole-package expanded coverage gate
        run: >-
          pytest tests -q --cov=buildml --cov-fail-under=83
          --cov-report=term --cov-report=json:artifacts/expanded-coverage.json
          --junitxml=artifacts/expanded-tests.xml --tb=short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-whole-package-coverage
          include-hidden-files: true
          path: |
            artifacts/expanded-*
            .coverage

  rl-compatible-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU Torch and the compatible RL profile
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-rl-verification.txt
          python -m pip check
      - name: Require real RL dependencies
        run: python -c "import torch, pyarrow, stable_baselines3, imitation; assert pyarrow.table({'x':[1]}).to_pandas().shape == (1,1)"
      - name: Exercise real RL and imitation contracts
        run: >-
          pytest tests/unit/test_rl_industry.py tests/unit/test_imitation_real_contracts.py
          -q --junitxml=artifacts/rl-contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rl-compatible-contracts-${{ matrix.os }}
          path: artifacts/rl-contracts.xml

  topology-compatible-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the compatible topology profile
        run: python -m pip install -r requirements-topology-verification.txt
      - name: Require real topology dependencies
        run: |
          python -m pip check
          python -c "import gtda, igraph, pyarrow, sklearn; print(gtda.__version__, igraph.__version__); assert pyarrow.table({'x': [1]}).to_pandas().shape == (1, 1)"
      - name: Exercise real topology shape and graph contracts
        run: >-
          pytest tests/unit/test_giotto_vector_shapes.py
          tests/unit/test_tda_giotto_padding.py tests/unit/test_tda_r5_industry.py
          tests/unit/test_giotto_mapper_semantics.py -q
          --junitxml=artifacts/topology-contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-compatible-contracts
          path: artifacts/topology-contracts.xml

  causal-compatible-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compatible causal profile
        run: python -m pip install -r requirements-causal-verification.txt
      - name: Require real causal backends
        run: |
          python -m pip check
          python -c "from dowhy import CausalModel; from econml.policy import DRPolicyTree; from econml.dml import LinearDML, CausalForestDML"
      - name: Known-effect, graph-name and policy contracts
        run: >-
          pytest tests/unit/test_dowhy_column_name_contracts.py
          tests/unit/test_econml_policy_contracts.py
          tests/unit/test_causal_industry_depth.py::test_dowhy_backend_recovers_ate
          tests/unit/test_causal_industry_depth.py::test_econml_dml_recovers_ate
          tests/unit/test_causal_industry_depth.py::test_econml_causal_forest_cate_std
          -q --junitxml=artifacts/causal-compatible-contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causal-compatible-contracts-${{ matrix.os }}
          path: artifacts/causal-compatible-contracts.xml

  econml-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real EconML backend
        run: python -m pip install -c requirements-expanded-coverage-constraints.txt -e ".[dev]" econml==0.17.0
      - name: Require usable policy and effect estimators
        run: |
          python -m pip check
          python -c "from econml.policy import DRPolicyTree; from econml.dml import LinearDML, CausalForestDML"
      - name: Known-effect and policy contracts
        run: >-
          pytest tests/unit/test_econml_policy_contracts.py
          tests/unit/test_causal_industry_depth.py::test_econml_dml_recovers_ate
          tests/unit/test_causal_industry_depth.py::test_econml_causal_forest_cate_std
          -q --junitxml=artifacts/econml-contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: econml-contracts-${{ matrix.os }}
          path: artifacts/econml-contracts.xml

  rag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with rag/ssl + lean test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rag,ssl]"
          pip install pytest pytest-cov ruff

      - name: Core import smoke without relying on RAG internals
        run: python -c "import buildml; print(buildml.__version__)"

      - name: RAG unit + integration + generate + alpha-gate smoke
        run: |
          pytest \
            tests/unit/test_rag_slice.py \
            tests/unit/test_rag_m2_depth.py \
            tests/unit/test_rag_generate.py \
            tests/integration/test_rag_smoke.py \
            tests/integration/test_rag_alpha_smoke.py \
            -q

      - name: Real local encoder checkpoints without downloads
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: pytest tests/unit/test_offline_local_encoder_contracts.py tests/unit/test_ai_runtime_workflow_contracts.py -q

      - name: RAG alpha-gate smoke (explicit)
        run: pytest tests/integration/test_rag_alpha_smoke.py -q

  ai:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with ai + lean test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai]"
          pip install pytest pytest-cov ruff

      - name: Core import smoke without relying on AI internals
        run: python -c "import buildml; print(buildml.__version__)"

      - name: AI unit tests (MockProvider only, no real keys)
        run: |
          pytest \
            tests/unit/test_ai_slice.py \
            tests/unit/test_ai_phase_c.py \
            tests/unit/test_executor_dispatch.py \
            tests/unit/test_pass_g_ai_autonomy.py \
            -q

  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extra: imbalanced
            tests: >-
              tests/unit/test_imbalance_harden.py
          - python-version: "3.12"
            extra: imbalanced
            tests: >-
              tests/unit/test_imbalance_harden.py
          - python-version: "3.11"
            extra: viz
            tests: >-
              tests/integration/test_eval_plot_boards.py
              tests/unit/test_model_reporting_milestone4.py
          - python-version: "3.12"
            extra: viz
            tests: >-
              tests/integration/test_eval_plot_boards.py
              tests/unit/test_model_reporting_milestone4.py
          - python-version: "3.11"
            extra: dashboard
            tests: >-
              tests/unit/test_eda_dashboard.py
              tests/unit/test_dashboard_export_integrity.py
              tests/unit/test_dashboard_json_integrity.py
              tests/unit/test_dashboard_api_integrity.py
          - python-version: "3.12"
            extra: dashboard
            tests: >-
              tests/unit/test_eda_dashboard.py
              tests/unit/test_dashboard_export_integrity.py
              tests/unit/test_dashboard_json_integrity.py
              tests/unit/test_dashboard_api_integrity.py
          - python-version: "3.11"
            extra: serve
            tests: >-
              tests/unit/test_pass_o_speech_ddp_serve.py
              tests/unit/test_pass_r_pretrained_serve_k8s.py
              tests/unit/test_pass_v_capability_depth.py
          - python-version: "3.12"
            extra: serve
            tests: >-
              tests/unit/test_pass_o_speech_ddp_serve.py
              tests/unit/test_pass_r_pretrained_serve_k8s.py
              tests/unit/test_pass_v_capability_depth.py
          - python-version: "3.11"
            extra: pretrained
            tests: >-
              tests/unit/test_pass_r_pretrained_serve_k8s.py
              tests/unit/test_pass_v_capability_depth.py
          - python-version: "3.12"
            extra: pretrained
            tests: >-
              tests/unit/test_pass_r_pretrained_serve_k8s.py
              tests/unit/test_pass_v_capability_depth.py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with ${{ matrix.extra }} + lean test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extra }}]"
          # Keep both clients for older and current Starlette test support.
          pip install pytest pytest-cov ruff httpx httpx2

      - name: Require imbalance backend
        if: matrix.extra == 'imbalanced'
        run: python -c "import imblearn"

      - name: Extra-focused tests (skip-friendly)
        run: pytest ${{ matrix.tests }} -q

  # Benchmark smokes (26 scripts via scripts/run_benchmark_smokes.py): core install
  # only — each script skips optional industry backends when extras are missing.
  # Covers R1–R6 domains (SSL through RL). Linux-only: Torch / PyG / some industry
  # wheels are flaky or unavailable on Windows CI; do not add windows-latest here.
  benchmarks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core only — benchmarks skip missing extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Benchmark smoke scripts
        run: python scripts/run_benchmark_smokes.py --verbose

  # Proof smoke gate: expanded Tier A CI subset, always re-run (no --skip-existing).
  # Core install only. Soft-skips (skipped_missing_extra/partial) fail the job
  # unless --allow-skip is passed (CI does not). Linux-only for the same wheel
  # reasons as benchmarks.
  proofs-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core + dashboard + pytest tooling)
        run: |
          python -m pip install --upgrade pip
          # dashboard: eda-industry-adaptability App/Static evidence in CI_SMOKE_TIER_A
          pip install -e ".[dev,dashboard]"

      - name: Tier A proof smoke (no skip-existing)
        run: python -m proofs._lib.run_all --smoke --timeout 600

  probabilistic-industry:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install real probabilistic backends
        run: python -m pip install -e ".[probabilistic-industry]" pytest
      - name: Require installed backends
        run: python -c "import mapie, ngboost; from mapie.regression import CrossConformalRegressor; print(mapie.__version__, ngboost.__version__)"
      - name: Verify dependency compatibility and record versions
        run: |
          python -m pip check
          python -m pip freeze > optional-environment.txt
      - name: Real MAPIE methods, alpha contracts, persistence and NGBoost scoring
        run: python -m pytest tests/unit/test_mapie_real_contract.py tests/unit/test_mapie_alpha_contract.py tests/unit/test_probabilistic_industry.py -q -rs --junitxml=optional-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probabilistic-industry-${{ matrix.python-version }}
          path: |
            optional-results.xml
            optional-environment.txt

  practical-optional:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: rl-tda
            extra: rl,tda
            imports: gymnasium,ripser,persim
            tests: tests/unit/test_rl_tabular.py tests/unit/test_tda_slice.py tests/unit/test_tda_m2_depth.py
          - group: excel
            extra: excel
            imports: openpyxl
            tests: tests/unit/test_excel_ingest.py
          - group: timeseries
            extra: timeseries
            imports: statsmodels,ruptures
            tests: tests/unit/test_timeseries_r3_depth.py tests/unit/test_forecasting_r3_depth.py
          - group: optimize
            extra: optimize-industry
            imports: pulp,ortools,cvxpy,xgboost
            tests: tests/unit/test_optimize_industry_depth.py tests/unit/test_optimize_cvxpy_adapter.py
          - group: anomaly
            extra: anomaly-industry
            imports: pyod,lightgbm,xgboost
            tests: tests/unit/test_anomaly_industry_depth.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install selected optional group
        run: python -m pip install -e ".[${{ matrix.extra }}]" pytest
      - name: Require advertised group dependencies
        env:
          REQUIRED_IMPORTS: ${{ matrix.imports }}
        run: python -c "import importlib, os; [importlib.import_module(name) for name in os.environ['REQUIRED_IMPORTS'].split(',')]"
      - name: Verify dependency compatibility and record versions
        run: |
          python -m pip check
          python -m pip freeze > optional-environment.txt
      - name: Run focused optional tests and record explicit skip reasons
        run: python -m pytest ${{ matrix.tests }} -q -rs --junitxml=optional-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-optional-${{ matrix.group }}
          path: |
            optional-results.xml
            optional-environment.txt
