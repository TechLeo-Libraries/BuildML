name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import smoke
        run: python -c "import buildml; print(buildml.__version__); assert hasattr(buildml, 'Session')"

      - name: Ruff
        run: ruff check buildml tests scripts docs/conf.py

      - name: User copy lint
        run: python scripts/lint_user_copy.py

      - name: Teaching surface sync
        run: python scripts/sync_teaching_surface.py --check

      - name: Mypy (scoped)
        run: >
          mypy --follow-imports=silent
          buildml/core
          buildml/explain/schemas.py
          buildml/explain/history.py
          buildml/explain/sync.py
          buildml/explain/concepts

      - name: Pytest
        run: pytest --cov=buildml --cov-report=term-missing

      - name: Checkpoint + pipeline smoke
        run: pytest tests/integration/test_checkpoint_pipeline_smoke.py -q

      - name: Classical alpha-gate smoke
        run: pytest tests/integration/test_classical_alpha_smoke.py -q

      - name: Build wheel
        run: python -m build

  engines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with engines + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,engines]"

      - name: Engine adapter and native-depth tests
        run: |
          pytest \
            tests/unit/test_engines.py \
            tests/unit/test_engine_aggregate.py \
            tests/unit/test_duckdb_pushdown.py \
            tests/unit/test_duckdb_arrow_ipc.py \
            tests/unit/test_duckdb_connection_lifecycle.py \
            tests/unit/test_polars_filter_expr.py \
            tests/unit/test_polars_lazyframe_handle.py \
            tests/unit/test_portable_filter_expr.py \
            tests/unit/test_checkpoint_native_sidecar.py \
            tests/unit/test_checkpoint_native_reattach.py \
            tests/unit/test_checkpoint_sidecar_layout.py \
            tests/unit/test_lazy_native_disclosure.py \
            tests/unit/test_lazy_native_ingest.py \
            -q

  optuna:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with optuna + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,optuna]"

      - name: Optuna search / nested-CV tests
        run: |
          pytest \
            tests/unit/test_optuna_search.py \
            tests/unit/test_nested_cv_optuna.py \
            tests/unit/test_nested_cv_warm_start.py \
            -q

  torch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with torch + lean test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[torch]"
          pip install pytest pytest-cov ruff

      - name: Core import smoke without relying on classical extras
        run: python -c "import buildml; print(buildml.__version__)"

      - name: Torch DL slice + M2 depth + Phase C + Pass G/J + DL alpha-gate smoke
        run: |
          pytest \
            tests/unit/test_dl_torch_slice.py \
            tests/unit/test_dl_m2_depth.py \
            tests/unit/test_dl_phase_c.py \
            tests/unit/test_pass_g_dl_depth.py \
            tests/unit/test_pass_j_image_multimodal.py \
            tests/integration/test_dl_torch_smoke.py \
            tests/integration/test_dl_alpha_smoke.py \
            -q

      - name: DL alpha-gate smoke (explicit)
        run: pytest tests/integration/test_dl_alpha_smoke.py -q

  rag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with rag + lean test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[rag]"
          pip install pytest pytest-cov ruff

      - name: Core import smoke without relying on RAG internals
        run: python -c "import buildml; print(buildml.__version__)"

      - name: RAG unit + integration + generate + alpha-gate smoke
        run: |
          pytest \
            tests/unit/test_rag_slice.py \
            tests/unit/test_rag_m2_depth.py \
            tests/unit/test_rag_generate.py \
            tests/integration/test_rag_smoke.py \
            tests/integration/test_rag_alpha_smoke.py \
            -q

      - name: RAG alpha-gate smoke (explicit)
        run: pytest tests/integration/test_rag_alpha_smoke.py -q

  ai:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with ai + lean test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai]"
          pip install pytest pytest-cov ruff

      - name: Core import smoke without relying on AI internals
        run: python -c "import buildml; print(buildml.__version__)"

      - name: AI unit tests (MockProvider only, no real keys)
        run: |
          pytest \
            tests/unit/test_ai_slice.py \
            tests/unit/test_ai_phase_c.py \
            tests/unit/test_executor_dispatch.py \
            tests/unit/test_pass_g_ai_autonomy.py \
            -q

  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extra: imbalanced
            tests: >-
              tests/unit/test_imbalance_harden.py
          - python-version: "3.12"
            extra: imbalanced
            tests: >-
              tests/unit/test_imbalance_harden.py
          - python-version: "3.11"
            extra: viz
            tests: >-
              tests/integration/test_eval_plot_boards.py
              tests/unit/test_model_reporting_milestone4.py
          - python-version: "3.12"
            extra: viz
            tests: >-
              tests/integration/test_eval_plot_boards.py
              tests/unit/test_model_reporting_milestone4.py
          - python-version: "3.11"
            extra: dashboard
            tests: >-
              tests/unit/test_eda_dashboard.py
          - python-version: "3.12"
            extra: dashboard
            tests: >-
              tests/unit/test_eda_dashboard.py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with ${{ matrix.extra }} + lean test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extra }}]"
          # Starlette TestClient needs httpx (dashboard FastAPI route tests).
          pip install pytest pytest-cov ruff httpx

      - name: Extra-focused tests (skip-friendly)
        run: pytest ${{ matrix.tests }} -q
