name: Release

# Manual / tag / GitHub-Release publish workflow. Does not auto-publish on every push.
# Trusted Publishing uses the protected pypi-release environment.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts only (skip PyPI publish)"
        type: boolean
        default: true
  push:
    tags:
      - "v2.*"
      - "v3.*"
  # gh release create / UI releases create the tag via API and may not emit a
  # tag push event that matches `push: tags` — also publish on release publish.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  full-ci:
    uses: ./.github/workflows/ci.yml

  acceptance:
    uses: ./.github/workflows/release-acceptance.yml

  preflight:
    needs: [full-ci, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-acceptance-candidate
          path: candidate/
      - name: Verify candidate identity
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: python scripts/check_release_gate.py --candidate candidate --commit "$CANDIDATE_SHA"
      - name: Check existing environment protections before requesting approval
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_gate.py --environment

  publish:
    needs: [full-ci, acceptance, preflight]
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: read
      actions: read
      id-token: write
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-acceptance-candidate
          path: candidate/
      - name: Recheck protections and exact approved candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_REF#refs/tags/}" != "$RELEASE_REF"
          python scripts/check_release_gate.py --environment --candidate candidate --commit "$CANDIDATE_SHA" --tag "$RELEASE_TAG"
          mkdir dist
          cp candidate/*.whl candidate/*.tar.gz dist/
      - name: Publish approved artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
