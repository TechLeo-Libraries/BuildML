name: Release

# Manual / tag-driven publish workflow. Does not auto-publish on every push.
# PyPI Session 2.x remains unpublished until an explicit release cut.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts only (skip PyPI publish)"
        type: boolean
        default: true
  push:
    tags:
      - "v2.*"
      - "v3.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  # Trusted publishing via OIDC (id-token). Do not set `environment:` here
  # unless a matching GitHub Environment exists under Settings → Environments;
  # an undefined name fails schema/IDE validation ("Value 'pypi' is not valid").
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
