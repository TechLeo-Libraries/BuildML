# default-store-name: buildml-serve-secrets
# default-store-field: api-key
# Generated by buildml.dl.k8s.render_serve_deployment
# Honesty: template only: not live multi-cluster / managed IAM.
# Image: build from deploy/serve/Dockerfile → buildml-serve:local
# Create the API-key store out of band (this file never writes key values):
#   kubectl create secret generic __STORE_NAME__ --namespace __NAMESPACE__ --from-literal=__STORE_FIELD__="$BUILDML_API_KEY"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __DEPLOY_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: buildml-serve
    app.kubernetes.io/part-of: buildml
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      app.kubernetes.io/name: buildml-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildml-serve
    spec:
__SA_LINE__      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: serve
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: __PORT__
          resources:
            requests:
              cpu: "__CPU__"
              memory: "__MEMORY__"
            limits:
              memory: "__MEMORY__"__GPU_LIMIT__
          env:
            - name: BUILDML_BUNDLE
              value: "__BUNDLE_PATH__"
            - name: BUILDML_SERVE_KIND
              value: "__KIND__"
            - name: BUILDML_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __STORE_NAME__
                  key: __STORE_FIELD__
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              if [[ -z "${BUILDML_API_KEY:-}" ]]; then
                echo "BUILDML_API_KEY secret is required (insecure public bind override is not enabled)" >&2
                exit 1
              fi
              exec buildml-serve \
                --bundle "${BUILDML_BUNDLE}" \
                --kind "${BUILDML_SERVE_KIND}" \
                --host 0.0.0.0 \
                --port __PORT__ \
                --api-key "${BUILDML_API_KEY}" \
                --trusted
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: __DEPLOY_NAME__
  namespace: __NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buildml-serve
  ports:
    - name: http
      port: __PORT__
      targetPort: http
