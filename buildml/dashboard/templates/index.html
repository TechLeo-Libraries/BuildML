<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · {{ app_name }}</title>
  <meta name="application-name" content="{{ app_name }}" />
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="stylesheet" href="/static/css/gates.css" />
  <script src="/vendor/plotly/plotly.min.js" defer></script>
  <!-- Module graph: learn_ui → gates_view / academy_view / cockpit_view → app. -->
  <script type="module" src="/static/js/learn_ui.js"></script>
  <script type="module" src="/static/js/gates_view.js"></script>
  <script type="module" src="/static/js/academy_view.js"></script>
  <script type="module" src="/static/js/cockpit_view.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="sheet" id="app" data-app="{{ app_name }}">
    <header class="sheet-chrome" id="sheet-chrome">
      <div class="sheet-chrome__brand">
        <div class="om-mono om-kick" id="sheet-kicker">{{ app_name }} · Exploratory data analysis</div>
        <h1 class="sheet-title" id="sheet-title">Command cockpit — readiness sheet</h1>
      </div>
      <div class="sheet-chrome__actions" id="sheet-actions">
        <a class="btn btn-ghost" href="#/gates">Readiness gates →</a>
        <a class="btn btn-ghost" href="#/academy">Concept academy →</a>
        <a class="btn btn-primary blueprint" id="html-download" href="/api/export/html" title="Download offline HTML snapshot">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          Offline HTML
        </a>
      </div>
    </header>

    <nav class="sheet-boards" id="domain-nav" aria-label="EDA boards"></nav>

    <main id="main" class="sheet-body" tabindex="-1"></main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="concept-drawer" aria-hidden="true" aria-label="Concept detail">
    <div class="drawer-head">
      <h2 id="drawer-title">Concept</h2>
      <button type="button" class="btn btn-ghost" id="drawer-close" aria-label="Close concept panel">Close</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="gate-drawer-backdrop" id="gate-drawer-backdrop" hidden></div>
  <aside class="gate-drawer" id="gate-drawer" aria-hidden="true" aria-label="Gate learning panel"></aside>

  <div class="gate-drawer-backdrop" id="cockpit-drawer-backdrop" hidden></div>
  <aside class="gate-drawer" id="cockpit-drawer" aria-hidden="true" aria-label="Cockpit learning panel"></aside>

  <dialog class="modal" id="figure-modal" aria-label="Expanded figure">
    <form method="dialog" class="modal-head">
      <h2 id="modal-title">Figure</h2>
      <button type="submit" class="btn btn-ghost" aria-label="Close figure">Close</button>
    </form>
    <div id="modal-figure" class="modal-figure"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
